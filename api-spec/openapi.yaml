    get:
      operationId: listLessons
      summary: List lessons in a module
      description: >
        Public. Private courses are only visible to their creator (404
        otherwise). In a paid course, callers who are neither the creator nor
        enrolled receive each lesson without `content`/`metadata`, with
        `content: null` and `locked: true`.
      tags: [learn]
      security:
        - cookieAuth: []
        - bearerAuth: []
        - {}
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lesson list
          content:
            application/json:
              schema:
                type: object
                properties:
                  lessons:
                    type: array
                    items: { $ref: "#/components/schemas/Lesson" }
        "404":
          description: Course not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createLesson
      summary: Add a lesson to a module (owner only)
      tags: [learn]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                contentType: { type: string, enum: [markdown, video, embed], default: markdown }
                content: { type: string }
                durationMinutes: { type: integer }
                sortOrder: { type: integer, description: "Auto-assigned if omitted" }
                metadata: { type: object }
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400":
          description: Title is required, or a request body that is not a valid JSON object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
